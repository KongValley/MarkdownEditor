name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-22.3.27-ia32

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ("v$($pkg.version)" -ne "${{ github.event.release.tag_name }}") {
            Write-Error "package.json version $($pkg.version) does not match tag ${{ github.event.release.tag_name }}"
          }

      - name: Build portable package
        env:
          SKIP_PACK_SMOKE: "1"
        run: npm run pack:win32

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownNotes-win32-ia32
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
